server:
  port: 8089
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cloud_user?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  type-aliases-package: cn.sjxy.user.pojo
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    cn.sjxy: debug
  pattern:
    dateformat: MM-dd HH:mm:ss:SSS
eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8888/eureka
